name: Release to Gizlet Store

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions: {}

jobs:
  package:
    if: github.ref_type == 'tag' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Test and build packages
        run: |
          echo '::error::Replace this step with the tests and .gzl build for your repository.'
          exit 1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gizlet-packages
          path: dist/*.gzl
          if-no-files-found: error
          overwrite: true

  release:
    needs: package
    permissions:
      contents: write
      id-token: write
    uses: gizlet/.github/.github/workflows/store-release.yml@latest

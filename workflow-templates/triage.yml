name: PR triage

# Starts pull-request CI and Codex review. Opening, updating, reopening or
# readying a pull request from a branch in this repository dispatches every
# mapped workflow on the default branch for its head; a writer's `/test` or
# `/codex-review` comment line runs one again. Runs on a GitHub-hosted runner
# and never checks out pull-request code.

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]
  issue_comment:
    types: [created]

permissions:
  contents: read

jobs:
  triage:
    if: >-
      github.event_name == 'pull_request_target'
      || (github.event.issue.pull_request && contains(github.event.comment.body, '/'))
    permissions:
      actions: write
      contents: read
      pull-requests: write
    uses: gizlet/.github/.github/workflows/pr-triage.yml@latest
    with:
      # One `/command=workflow.yml [workflow.yml ...]` per line. Each workflow
      # accepts pull_request_number and head_sha dispatch inputs.
      commands: |
        /test=ci.yml
        /codex-review=codex-review.yml

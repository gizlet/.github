name: PR auto trigger (deprecated)

# Deprecated no-op kept so callers from pull_request_target keep validating
# after `latest` moves. Pull-request CI and review now start only from comment
# commands through pr-triage.yml; replace the caller with
# workflow-templates/triage.yml. Remove once no repository calls this file.

on:
  workflow_call:
    inputs:
      workflows:
        description: Ignored.
        required: false
        default: ''
        type: string
      command:
        description: Ignored.
        required: false
        default: /test
        type: string
    outputs:
      dispatched:
        description: Always 'false'.
        value: 'false'

jobs:
  trigger:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    permissions: {}
    steps:
      - name: Report the deprecation
        run: >-
          echo "::warning title=Deprecated triage::Pushes no longer start CI or review.
          Replace triage.yml with gizlet/.github workflow-templates/triage.yml and use
          /test or /codex-review comments."

name: PR auto trigger

# Called from pull_request_target. Never checks out pull-request code. When the
# pull request is open, not a draft, and its head branch is in the calling
# repository, dispatches each listed workflow on the default branch with
# pull_request_number and head_sha inputs. Otherwise nothing runs and a
# maintainer can use the slash command instead.

on:
  workflow_call:
    inputs:
      workflows:
        description: Comma-separated workflow file names to dispatch, such as build.yml.
        required: true
        type: string
      command:
        description: Slash command mentioned in notices, such as /test.
        required: false
        default: /test
        type: string
    outputs:
      dispatched:
        description: "'true' when the workflows were dispatched."
        value: ${{ jobs.trigger.outputs.dispatched }}

jobs:
  trigger:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
      issues: write
      pull-requests: read
    outputs:
      dispatched: ${{ steps.trigger.outputs.dispatched }}
    steps:
      - name: Check out the trigger implementation
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .pr-command-source
          sparse-checkout: .github/scripts/pr-command
          persist-credentials: false

      - name: Decide and dispatch
        id: trigger
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          WORKFLOWS: ${{ inputs.workflows }}
          COMMAND: ${{ inputs.command }}
        with:
          script: |
            const { pathToFileURL } = require('node:url');
            const { autoTrigger } = await import(pathToFileURL(
              `${process.env.GITHUB_WORKSPACE}/.pr-command-source/.github/scripts/pr-command/auto-trigger.mjs`,
            ).href);
            await autoTrigger({ github, context, core });

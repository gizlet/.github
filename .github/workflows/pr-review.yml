name: Codex review

# This repository's own caller; consumers start from workflow-templates/codex-review.yml.

on:
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pull_request_number:
        description: Open pull request to review.
        required: true
        type: string
      head_sha:
        description: Expected pull-request head, set by automatic triggers.
        required: false
        default: ''
        type: string

permissions:
  contents: read

jobs:
  review:
    if: >-
      github.event_name == 'workflow_dispatch'
      || (github.event.issue.pull_request && contains(github.event.comment.body, '/codex-review'))
    concurrency:
      group: codex-review-${{ github.event.issue.number || inputs.pull_request_number }}
      cancel-in-progress: false
    permissions:
      checks: write
      contents: read
      issues: write
      pull-requests: write
    uses: ./.github/workflows/codex-review.yml
    with:
      pull_request_number: ${{ inputs.pull_request_number }}
      head_sha: ${{ inputs.head_sha }}
    secrets:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

name: Codex review

# This repository's own caller; consumers start from workflow-templates/codex-review.yml.

on:
  workflow_dispatch:
    inputs:
      pull_request_number:
        description: Open pull request to review.
        required: true
        type: string
      head_sha:
        description: Expected pull-request head, set by triage.
        required: false
        default: ''
        type: string

permissions:
  contents: read

jobs:
  review:
    concurrency:
      group: codex-review-${{ inputs.pull_request_number }}
      cancel-in-progress: false
    permissions:
      checks: write
      contents: read
      issues: write
      pull-requests: write
    uses: ./.github/workflows/codex-review.yml
    with:
      pull_request_number: ${{ inputs.pull_request_number }}
      head_sha: ${{ inputs.head_sha }}
    secrets:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

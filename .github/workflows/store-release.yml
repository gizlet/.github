name: Release to Gizlet Store

on:
  workflow_call:
    inputs:
      artifact-name:
        description: Same-run artifact containing the release's .gzl files at its root.
        type: string
        default: gizlet-packages

permissions: {}

defaults:
  run:
    shell: bash

jobs:
  release:
    name: Publish GitHub Release
    runs-on: ${{ fromJSON(vars.RUNNERS || '{}')['default'] || 'ubuntu-24.04' }}
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Verify release tag
        run: |
          if [[ "$GITHUB_REF_TYPE" != tag || ! "$GITHUB_REF_NAME" =~ ^v[0-9A-Za-z][0-9A-Za-z.+-]{0,63}$ ]]; then
            echo '::error::Run this workflow on a tag named v<version>.'
            exit 1
          fi
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ inputs.artifact-name }}
          path: ${{ runner.temp }}/gizlet-release-packages
      - name: Publish packages
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          packages=("$RUNNER_TEMP"/gizlet-release-packages/*.gzl)
          if (( ${#packages[@]} == 0 )); then
            echo '::error::The release artifact contains no .gzl files.'
            exit 1
          fi

          if ! release=$(gh release view "$GITHUB_REF_NAME" --json isDraft,isPrerelease,assets); then
            gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --draft
            release='{"isDraft":true,"isPrerelease":false}'
          fi
          if jq -e '.isPrerelease' <<< "$release" >/dev/null; then
            echo '::error::Expected a stable GitHub Release for this tag.'
            exit 1
          fi
          if jq -e '.isDraft' <<< "$release" >/dev/null; then
            gh release upload "$GITHUB_REF_NAME" "${packages[@]}" --clobber
            gh release edit "$GITHUB_REF_NAME" --draft=false
          else
            for package in "${packages[@]}"; do
              if ! jq -e --arg name "${package##*/}" \
                '.assets | any(.name == $name and .state == "uploaded")' <<< "$release" >/dev/null; then
                echo "::error::Published release is missing ${package##*/}."
                exit 1
              fi
            done
          fi

  publish:
    name: Index and verify on Gizlet Store
    needs: release
    runs-on: ${{ fromJSON(vars.RUNNERS || '{}')['default'] || 'ubuntu-24.04' }}
    timeout-minutes: 12
    permissions:
      id-token: write
    steps:
      - name: Index the release and wait for checks
        env:
          STORE_API: https://api.gizlet.io
        run: |
          oidc_token=$(curl --fail --silent --show-error --max-time 20 \
            -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            --get --data-urlencode "audience=$STORE_API" "$ACTIONS_ID_TOKEN_REQUEST_URL" | jq -er '.value')
          echo "::add-mask::$oidc_token"
          body=$(jq -cn --arg tag "$GITHUB_REF_NAME" '{tag: $tag}')
          if ! response=$(curl --fail-with-body --silent --show-error --max-time 60 \
            -H "Authorization: Bearer $oidc_token" -H 'Content-Type: application/json' \
            --data "$body" "$STORE_API/v1/publish"); then
            printf 'Store publish failed: %s\n' "$response" >&2
            exit 1
          fi
          status_url=$(jq -er '.status_url' <<< "$response")
          share_url=$(jq -er '.share_url' <<< "$response")
          printf 'Store page: %s\nRelease status: %s\n' "$share_url" "$status_url"

          deadline=$((SECONDS + 600))
          while (( SECONDS < deadline )); do
            if response=$(curl --fail --silent --show-error --max-time 15 "$status_url"); then
              status=$(jq -er '.status' <<< "$response")
              case "$status" in
                ready)
                  jq -r '"Visibility: \(.visibility)", (.warnings[]? | "Warning: \(.)")' <<< "$response"
                  printf 'Gizlet Store: [%s](%s)\n' "$GITHUB_REF_NAME" "$share_url" >> "$GITHUB_STEP_SUMMARY"
                  exit 0
                  ;;
                failed)
                  jq -r '.error // "Store checks failed"' <<< "$response" >&2
                  exit 1
                  ;;
                pending|mirroring|checking) printf 'Store status: %s\n' "$status" ;;
                *) printf 'Unexpected Store status: %s\n' "$status" >&2; exit 1 ;;
              esac
            fi
            sleep 10
          done
          echo '::error::Timed out waiting for Gizlet Store checks.'
          exit 1

name: PR triage

# This repository's own caller; consumers start from workflow-templates/triage.yml.
# Opening, updating, reopening or readying a pull request from a branch in this
# repository makes gizlet-bot comment /ci and /codex-review for its head; the
# gated workflows start from that comment. Runs on a GitHub-hosted runner and
# never checks out pull-request code.

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: read

jobs:
  triage:
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/pr-triage.yml
    with:
      commands: |
        /ci
        /codex-review
      client-id: ${{ vars.GIZLET_BOT_CLIENT_ID }}
    secrets:
      GIZLET_BOT_PRIVATE_KEY: ${{ secrets.GIZLET_BOT_PRIVATE_KEY }}

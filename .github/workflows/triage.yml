name: PR triage

# This repository's own caller; consumers start from workflow-templates/triage.yml.
# A comment line from a user with write access dispatches the mapped
# workflows on the default branch for the pull request's current head; nothing
# runs on push. Runs on a GitHub-hosted runner and never checks out
# pull-request code.

on:
  issue_comment:
    types: [created]

permissions:
  contents: read

jobs:
  triage:
    if: github.event.issue.pull_request && contains(github.event.comment.body, '/')
    permissions:
      actions: write
      contents: read
      pull-requests: write
    uses: ./.github/workflows/pr-triage.yml
    with:
      # One `/command=workflow.yml [workflow.yml ...]` per line. Each workflow
      # accepts pull_request_number and head_sha dispatch inputs.
      commands: |
        /test=test.yml
        /codex-review=pr-review.yml
